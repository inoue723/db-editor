name: Release

on:
  push:
    branches: [main]
  # Manual run: builds the installers and uploads them as workflow artifacts,
  # without creating a tag or a GitHub Release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # release-please is skipped on manual runs, so `!cancelled()` keeps this job from being skipped too.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15
            args: --target x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev libxdo-dev
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      # Until an Apple Developer ID is available, macOS builds use ad-hoc signing
      # (bundle.macOS.signingIdentity = "-") and are not notarized.
      # When it is, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_PATH to the release environment.
      # With no tagName (manual runs), tauri-action only builds and does not touch Releases.
      # release-please creates the release as a draft (release-please-config.json), so
      # releaseDraft must be true for tauri-action to find it by tag.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (bundle.createUpdaterArtifacts). Without it the build fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: db editor ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: true
          # The three matrix jobs would race to rewrite latest.json; the updater-json job writes it once.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Upload installers (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-editor-${{ matrix.name }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  # Writes latest.json, the manifest the in-app updater reads from
  # https://github.com/<repo>/releases/latest/download/latest.json.
  # The release stays a draft, so installed apps see the update only once it is published.
  updater-json:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "$TAG" --pattern '*.sig' --dir "$dir"
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          platforms='{}'
          add() { # <platform key> <asset name>
            platforms="$(jq --arg key "$1" --arg url "$base/$2" --rawfile sig "$dir/$2.sig" \
              '.[$key] = {url: $url, signature: ($sig | rtrimstr("\n"))}' <<<"$platforms")"
          }
          for sig in "$dir"/*.sig; do
            asset="$(basename "$sig" .sig)"
            case "$asset" in
              *_aarch64.app.tar.gz) add darwin-aarch64 "$asset"; add darwin-aarch64-app "$asset" ;;
              *_x64.app.tar.gz) add darwin-x86_64 "$asset"; add darwin-x86_64-app "$asset" ;;
              *.AppImage) add linux-x86_64 "$asset"; add linux-x86_64-appimage "$asset" ;;
              *.deb) add linux-x86_64-deb "$asset" ;;
              *.rpm) add linux-x86_64-rpm "$asset" ;;
            esac
          done
          for key in darwin-aarch64 darwin-x86_64 linux-x86_64 linux-x86_64-deb linux-x86_64-rpm; do
            if ! jq -e --arg key "$key" 'has($key)' <<<"$platforms" >/dev/null; then
              echo "::error::No signed updater artifact for $key"
              exit 1
            fi
          done
          gh release view "$TAG" --json body --jq .body >"$dir/notes.md"
          jq -n --arg version "$VERSION" --rawfile notes "$dir/notes.md" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            >"$dir/latest.json"
          cat "$dir/latest.json"
          gh release upload "$TAG" "$dir/latest.json" --clobber
