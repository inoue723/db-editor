# cargo-deny: vulnerabilities, licenses (must be compatible with MIT distribution), sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are reported only for our direct dependencies; transitive ones
# (paste via tauri-specta, proc-macro-error via gtk-rs) are out of our hands.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
